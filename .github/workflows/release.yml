name: Release

# Push a tag such as v0.2.0 to test, build and publish a Windows release:
#   git tag v0.2.0
#   git push origin v0.2.0
# "Run workflow" on the Actions page does a dry run: it builds and keeps the zip as a
# downloadable artifact, but publishes no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --release --bins

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/grapht | Out-Null
          Copy-Item target/release/grapht.exe dist/grapht/
          Copy-Item README.md, LICENSE dist/grapht/
          Copy-Item sample dist/grapht/sample -Recurse
          Compress-Archive -Path dist/grapht/* -DestinationPath grapht-windows-x64.zip
          (Get-FileHash grapht-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  grapht-windows-x64.zip" | Out-File -Encoding ascii grapht-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: grapht-windows-x64
          path: |
            grapht-windows-x64.zip
            grapht-windows-x64.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grapht-windows-x64.zip
            grapht-windows-x64.zip.sha256
          generate_release_notes: true
