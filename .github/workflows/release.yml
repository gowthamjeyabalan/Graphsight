name: Release

# Push a tag such as v0.9.0 (matching the version in Cargo.toml) to test, build and publish a
# Windows release with an installer and a portable zip:
#   git tag v0.9.0
#   git push origin v0.9.0
# "Run workflow" on the Actions page does a dry run: it builds and keeps the installer and the zip
# as a downloadable artifact, but publishes no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "The tag ${{ github.ref_name }} does not match the version $v in Cargo.toml"
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --release --bins

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/grapht | Out-Null
          Copy-Item target/release/grapht.exe dist/grapht/
          Copy-Item README.md, LICENSE dist/grapht/
          Copy-Item sample dist/grapht/sample -Recurse
          Compress-Archive -Path dist/grapht/* -DestinationPath grapht-windows-x64.zip

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\grapht.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item dist/grapht-setup-x64.exe .
          foreach ($f in "grapht-setup-x64.exe", "grapht-windows-x64.zip") {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: grapht-windows-x64
          path: |
            grapht-setup-x64.exe
            grapht-setup-x64.exe.sha256
            grapht-windows-x64.zip
            grapht-windows-x64.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Grapht ${{ steps.version.outputs.version }}
          files: |
            grapht-setup-x64.exe
            grapht-setup-x64.exe.sha256
            grapht-windows-x64.zip
            grapht-windows-x64.zip.sha256
          generate_release_notes: true
