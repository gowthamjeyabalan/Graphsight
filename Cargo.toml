[package]
name = "grapht"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
eframe = "0.37.0"
egui_dock = { path = "vendor/egui_dock", features = ["serde"] }
egui = { version = "0.37.0", features = ["serde"] }
egui_extras = "0.37.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
