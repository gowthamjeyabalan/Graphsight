[package]
name = "graphsight"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
# OpenGL instead of wgpu: it draws the see-through window (Windows 11 backdrop) correctly, as in Overlay
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "web_screen_reader", "x11"] }
egui_dock = { path = "vendor/egui_dock", features = ["serde"] }
egui = { version = "0.37.0", features = ["serde"] }
egui_extras = "0.37.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
raw-window-handle = "0.6"
tiny-skia = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
